id: no-blocking-requests-in-async
language: Python
severity: error
message: Blocking requests calls are forbidden inside async functions
note: Use the injected async request backend so cao-server's event loop stays responsive.
rule:
  all:
    - any:
        - pattern: requests.$METHOD($$$ARGS)
        - pattern: _load_skill_impl($$$ARGS)
        - pattern: _send_message_impl($$$ARGS)
        - pattern: _send_user_prompt_answer($$$ARGS)
        - pattern: _get_cleanup_nudge($$$ARGS)
        - pattern: _assign_impl($$$ARGS)
        - pattern: _resolve_handoff_provider($$$ARGS)
        - pattern: _get_terminal_context_from_env($$$ARGS)
    - inside:
        any:
          - pattern: |
              async def $FUNC($$$PARAMS):
                $$$BODY
          - pattern: |
              async def $FUNC($$$PARAMS) -> $RETURN:
                $$$BODY
        stopBy: end
constraints:
  METHOD:
    regex: ^(get|post|put|patch|delete|request|head|options)$
